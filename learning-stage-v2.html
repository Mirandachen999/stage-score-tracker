<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>我的學習冒險｜關卡成績紀錄</title>
<style>
:root{--bg:#121d23;--panel:#1b2a31;--panel2:#26363e;--line:#35454e;--muted:#93a8b1;--white:#f4f9fa;--lime:#79cd38;--lime-dark:#59a724;--purple:#b778e7;--blue:#5e98f8;--gold:#ffcc4e;--pink:#ef78bd}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--white);font:500 16px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #a2d4ff;outline-offset:3px}
.app{max-width:620px;margin:auto;min-height:100dvh;padding-bottom:118px}.top{position:sticky;top:0;z-index:8;background:#121d23f5;backdrop-filter:blur(12px);padding:19px 24px 14px;border-bottom:1px solid #24343b}.topline{display:flex;align-items:center;justify-content:space-between;gap:9px}.logo{font-size:15px;font-weight:900;letter-spacing:.03em;color:#b8e899}.stats{display:flex;align-items:center;gap:15px}.stat{display:flex;align-items:center;gap:5px;font-size:18px;font-weight:900;white-space:nowrap}.stat .icon{font-size:21px}.stat.xp{color:#66b8f6}.stat.done{color:#ffcd56}.stat.total{color:#e391c6}.hero{margin:20px 24px 0;background:var(--lime);border-radius:22px;padding:20px 22px 22px;box-shadow:inset 0 -7px #62aa2c;color:white;display:flex;align-items:center;justify-content:space-between;gap:12px}.hero small{display:block;opacity:.85;font-size:17px;font-weight:800}.hero h1{font-size:24px;margin:4px 0 0;line-height:1.22}.hero button{border:0;background:#ffffff27;color:white;border-radius:12px;font-size:24px;padding:7px 12px}.section-controls{display:flex;gap:8px;padding:16px 24px 0;align-items:center}.section-controls select{flex:1;min-width:0;background:#26363e;color:#fff;border:1px solid #40545c;border-radius:12px;padding:11px}.small-btn{background:#2b3d46;color:#fff;border:1px solid #475c63;border-radius:12px;padding:10px 13px;font-weight:800;white-space:nowrap}.help{padding:0 27px;margin:13px 0 0;color:var(--muted);font-size:13px}.path{padding:20px 22px 4px;position:relative}.stage{display:flex;position:relative;min-height:153px;align-items:flex-start}.stage:nth-child(odd){justify-content:center}.stage:nth-child(4n+2){justify-content:flex-end;padding-right:40px}.stage:nth-child(4n+3){justify-content:center;padding-right:125px}.stage:nth-child(4n+4){justify-content:center;padding-left:120px}.stage:after{content:"";position:absolute;z-index:0;top:72px;height:79px;width:2px;border-left:3px dashed #3e5157;left:50%;opacity:.55}.stage:last-child:after{display:none}.stage-bubble{position:relative;z-index:1;width:111px;min-height:111px;border:0;border-radius:50%;background:#34434c;box-shadow:inset 0 -12px #293840;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:12px 7px;color:#8298a2;transition:transform .15s,filter .15s}.stage-bubble:hover{transform:translateY(-4px);filter:brightness(1.12)}.stage-bubble.active{background:var(--lime);color:white;box-shadow:inset 0 -12px var(--lime-dark),0 0 0 7px #b779e52b}.stage-bubble.active:before{content:"";position:absolute;inset:-14px;border:8px solid var(--purple);border-left-color:transparent;border-bottom-color:transparent;border-radius:50%;transform:rotate(-12deg);pointer-events:none}.stage-bubble.done{background:#508bcf;box-shadow:inset 0 -12px #3973b8;color:#fff}.stage-bubble .em{font-size:35px;line-height:1.2}.stage-bubble .score{font-size:13px;font-weight:900}.stage-caption{position:absolute;z-index:2;top:114px;left:0;right:0;text-align:center;color:#c8d4d9;font-size:12px;font-weight:700;white-space:nowrap;max-width:180px;margin:auto;overflow:hidden;text-overflow:ellipsis}.stage:nth-child(4n+2) .stage-caption{left:auto;right:7px;width:175px}.stage:nth-child(4n+3) .stage-caption{right:125px}.stage:nth-child(4n+4) .stage-caption{left:120px}.stage.active-stage .stage-caption{color:#c8f2a5}.bottom{position:fixed;z-index:9;bottom:0;left:0;right:0;background:#141f25f5;border-top:2px solid #30424b;backdrop-filter:blur(10px);padding:10px max(18px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:20px}.bottom button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:74px;background:none;border:2px solid transparent;border-radius:14px;color:#a5b9c1;padding:6px 10px;font-size:11px;font-weight:800}.bottom button .ico{font-size:27px}.bottom button.selected{border-color:#4f8db0;color:#fff;background:#273d4a}.view{display:none}.view.visible{display:block}.dashboard{padding:21px 24px}.dashboard h2{font-size:21px}.card{background:var(--panel);border:1px solid #30434a;border-radius:17px;padding:19px;margin:14px 0}.big{font-size:32px;font-weight:950;color:#b4e87d}.progress-track{height:14px;border-radius:20px;background:#34454d;overflow:hidden}.progress-fill{height:100%;background:var(--lime);width:0;transition:width .3s}.record{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #34454d}.record:last-child{border:0}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.action{border:0;border-radius:12px;background:#77c936;color:#fff;font-weight:850;padding:12px 15px;box-shadow:inset 0 -4px #5aa829}.action.alt{background:#32454e;box-shadow:none}.file-info{font-size:13px;color:#a8b9c0;line-height:1.7}.modal-bg{display:none;position:fixed;inset:0;z-index:20;background:#000b;align-items:center;justify-content:center;padding:18px}.modal-bg.open{display:flex}.modal{background:#203039;border:1px solid #455d64;border-radius:24px;width:min(100%,470px);max-height:90dvh;overflow:auto;padding:24px;box-shadow:0 30px 90px #0009}.modal h2{margin:0 0 5px}.modal p{color:#a9bbc1;margin:3px 0 20px}.field{display:block;margin:15px 0;font-size:14px;color:#d2e1e5;font-weight:800}.field input,.field textarea{width:100%;display:block;margin-top:7px;background:#111f25;border:1px solid #4a636b;border-radius:11px;padding:12px;color:white}.field textarea{resize:vertical;min-height:76px}.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.modal-actions .action{flex:1}.danger{color:#ffacb9!important}.toast{position:fixed;z-index:30;top:85px;left:50%;transform:translateX(-50%);background:#335845;color:#fff;padding:11px 19px;border-radius:12px;box-shadow:0 6px 25px #0007;display:none;max-width:90%;text-align:center}.empty{color:#92aab2;padding:18px 0}.pill{background:#334b42;color:#a8f087;border-radius:30px;padding:3px 9px;font-size:12px}input[type=file]{display:none}@media(max-width:390px){.top{padding:15px 13px}.stats{gap:8px}.stat{font-size:15px}.hero{margin:14px 14px 0}.stage:nth-child(4n+2){padding-right:12px}.stage:nth-child(4n+3){padding-right:70px}.stage:nth-child(4n+4){padding-left:75px}.stage:nth-child(4n+3) .stage-caption{right:70px}.stage:nth-child(4n+4) .stage-caption{left:75px}.bottom{gap:4px}.bottom button{min-width:68px}.section-controls{padding-left:14px;padding-right:14px}}

/* 五科獨立色系，兼顧深色背景的辨識度 */
.stage-bubble.subject-chinese{background:#ed718d;box-shadow:inset 0 -12px #ba4968;color:white}
.stage-bubble.subject-math{background:#4eabf2;box-shadow:inset 0 -12px #307cb7;color:white}
.stage-bubble.subject-english{background:#ad78ed;box-shadow:inset 0 -12px #8056b9;color:white}
.stage-bubble.subject-science{background:#64c987;box-shadow:inset 0 -12px #36995c;color:white}
.stage-bubble.subject-social{background:#f0aa4b;box-shadow:inset 0 -12px #bd7929;color:white}
.subject-pill{display:inline-block;padding:3px 10px;border-radius:999px;color:white;font-size:12px;font-weight:850;background:#53656d}
.subject-pill.subject-chinese{background:#c95775}.subject-pill.subject-math{background:#357eb7}.subject-pill.subject-english{background:#8655bf}.subject-pill.subject-science{background:#368f55}.subject-pill.subject-social{background:#b6782d}
.legend{display:flex;gap:7px;flex-wrap:wrap;padding:12px 24px 0}.legend .subject-pill{font-size:12px}
.field select{width:100%;display:block;margin-top:7px;background:#111f25;border:1px solid #4a636b;border-radius:11px;padding:12px;color:white}
.stage-bubble .em{font-size:30px}.section-controls button:disabled{opacity:.4}.record .subject-pill{margin-right:7px}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="topline"><span class="logo">📚 學習冒險</span><div class="stats"><span class="stat xp"><span class="icon">💎</span><span id="xp">0</span></span><span class="stat done"><span class="icon">⭐</span><span id="done">0</span></span><span class="stat total"><span class="icon">🏆</span><span id="totalScore">0</span></span></div></div></header>
<main id="mapView" class="view visible"><div class="hero"><div><small id="sectionLine">第 8 階段，第 1 部分</small><h1 id="sectionTitle">我的學習地圖</h1></div><button id="jumpBtn" title="觀看紀錄" aria-label="觀看紀錄">☷</button></div><div class="section-controls"><select id="sectionSelect" aria-label="選擇階段"></select><button class="small-btn" id="prevSection" aria-label="上一階段">←</button><button class="small-btn" id="nextSection" aria-label="下一階段">→</button><button class="small-btn" id="addSection" aria-label="新增階段">＋ 新階段</button></div><p class="help">點選任一關卡，即可輸入科目、分數與備註。每一關都能獨立保存。</p><div class="legend"><span class="subject-pill subject-chinese">國文</span><span class="subject-pill subject-math">數學</span><span class="subject-pill subject-english">英文</span><span class="subject-pill subject-science">自然</span><span class="subject-pill subject-social">社會</span></div><div class="path" id="path"></div></main>
<section id="reportView" class="view dashboard"><h2>📊 我的學習紀錄</h2><div class="card"><div class="muted">已完成關卡 / 全部關卡</div><div class="big" id="completionText">0 / 40</div><div class="progress-track"><div id="progressFill" class="progress-fill"></div></div><p class="muted" id="averageText">平均分數：—</p></div><div class="card"><b>成績明細</b><div id="records"></div></div></section>
<section id="settingsView" class="view dashboard"><h2>⚙️ 資料管理</h2><div class="card"><b id="storageMode">檢查儲存方式中…</b><p class="file-info" id="storageDesc"></p><div class="actions"><button class="action" id="downloadBtn">⬇️ 匯出 records.txt</button><button class="action alt" id="uploadBtn">⬆️ 匯入 TXT</button><input id="uploadFile" type="file" accept=".txt,.json,text/plain,application/json" /></div><p class="file-info">TXT 內容採用標準 JSON 格式，可使用記事本或 VS Code 開啟。匯入前請先備份。</p></div><div class="card"><b>關卡設定</b><label class="field">關卡總階段數（每階段 5 關，無固定上限）<input id="sectionCount" type="number" min="1" step="1" value="8" /></label><button id="saveSectionCount" class="action alt">儲存階段數</button><p class="file-info">可按「＋ 新階段」一直新增，或在這裡直接輸入階段數。縮減只會隱藏關卡，原有紀錄仍保留。</p></div><div class="card"><b>危險操作</b><p class="file-info">清空所有科目、分數與備註（無法復原）。</p><button id="clearBtn" class="action alt danger">清空所有紀錄</button></div></section>
</div>
<nav class="bottom" aria-label="主選單"><button class="selected" data-view="mapView"><span class="ico">🏠</span>闖關地圖</button><button data-view="reportView"><span class="ico">📈</span>成績紀錄</button><button data-view="settingsView"><span class="ico">⚙️</span>設定 / TXT</button></nav>
<div class="modal-bg" id="modalBg"><form class="modal" id="stageForm"><h2 id="modalTitle">第 1 關</h2><p>記錄這一關的學習成果</p><label class="field">科目 / 關卡名稱 <select id="subjectInput" required><option value="">請選擇科目</option><option>國文</option><option>數學</option><option>英文</option><option>自然</option><option>社會</option></select></label><label class="field">分數（0–100）<input id="scoreInput" type="number" min="0" max="100" step="0.1" placeholder="例如：95" required /></label><label class="field">學習備註（選填）<textarea id="notesInput" maxlength="1000" placeholder="例如：分數進步了！下次加強應用題。"></textarea></label><div class="modal-actions"><button type="button" class="action alt" id="cancelBtn">取消</button><button type="button" class="action alt danger" id="deleteBtn">刪除紀錄</button><button type="submit" class="action">💾 儲存</button></div></form></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
'use strict';
const KEY='study-stage-tracker-json-v1';
const titles=['新的開始','學習探索','挑戰自我','知識成長','持續進步','完成任務','挑戰高手','讚美產品','學習高手','超級挑戰'];
const SUBJECT_CLASSES={'國文':'subject-chinese','數學':'subject-math','英文':'subject-english','自然':'subject-science','社會':'subject-social'};
let data={version:1,sectionCount:8,records:{}};let currentSection=8,editingId=null,serverMode=false;
const $=id=>document.getElementById(id);
const stageId=(s,p)=>`${s}-${p}`;
function normalize(raw){if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('JSON 格式錯誤');const count=Number(raw.sectionCount)||8;if(!Number.isInteger(count)||count<1||!Number.isSafeInteger(count))throw Error('請輸入有效的正整數階段數');const records={};for(const [id,v] of Object.entries(raw.records||{})){if(!/^\d+-[1-5]$/.test(id)||!v||typeof v!=='object')continue;const score=Number(v.score);if(!Number.isFinite(score)||score<0||score>100)continue;records[id]={subject:String(v.subject||'').slice(0,80),score,notes:String(v.notes||'').slice(0,1000),updatedAt:String(v.updatedAt||new Date().toISOString())};}return {version:1,sectionCount:count,records};}
async function load(){const local=localStorage.getItem(KEY);try{const resp=await fetch('/api/data',{cache:'no-store'});if(!resp.ok)throw Error('API unavailable');data=normalize(await resp.json());serverMode=true;localStorage.setItem(KEY,JSON.stringify(data));}catch{serverMode=false;if(local){try{data=normalize(JSON.parse(local));}catch{}}}currentSection=Math.min(8,data.sectionCount);render();}
async function save(next){next=normalize(next);if(serverMode){const r=await fetch('/api/data',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(next)});if(!r.ok){let info;try{info=(await r.json()).error}catch{}throw Error(info||'無法寫入伺服器 records.txt');}next=normalize(await r.json());}data=next;localStorage.setItem(KEY,JSON.stringify(data));render();}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',2700)}
function render(){const visible=Object.entries(data.records).filter(([id])=>Number(id.split('-')[0])<=data.sectionCount).map(([,v])=>v);$('xp').textContent=visible.reduce((n,x)=>n+Math.round(x.score),0);$('done').textContent=visible.length;$('totalScore').textContent=visible.reduce((n,x)=>n+x.score,0).toLocaleString('zh-TW',{maximumFractionDigits:1});$('sectionCount').value=data.sectionCount;$('sectionSelect').innerHTML='';for(let s=1;s<=data.sectionCount;s++){const op=document.createElement('option');op.value=s;op.textContent=`第 ${s} 階段 · ${titles[s-1]||'學習冒險'}`;$('sectionSelect').append(op)}currentSection=Math.min(currentSection,data.sectionCount);$('sectionSelect').value=currentSection;$('sectionLine').textContent=`第 ${currentSection} 階段，第 1 部分`;$('sectionTitle').textContent=titles[currentSection-1]||'學習冒險';$('prevSection').disabled=currentSection===1;$('nextSection').disabled=false;renderPath();renderReport();$('storageMode').textContent=serverMode?'✅ 伺服器 TXT 自動儲存':'📱 瀏覽器本機儲存';$('storageDesc').textContent=serverMode?'每次按下儲存，就會同步更新網站伺服器的 data/records.txt（JSON 格式）。也可匯出備份。':'目前以 localStorage 保存在這個瀏覽器，並非寫入伺服器 TXT。請定期使用「匯出 records.txt」備份；若想自動寫入網站 TXT，請透過附帶的 server.py 啟動網站。';}
function renderPath(){const path=$('path');path.replaceChildren();for(let p=1;p<=5;p++){const id=stageId(currentSection,p),r=data.records[id];const row=document.createElement('div');row.className='stage'+(p===1?' active-stage':'');const btn=document.createElement('button');btn.type='button';btn.className='stage-bubble'+(r?' '+(SUBJECT_CLASSES[r.subject]||'done'):p===1?' active':'');btn.setAttribute('aria-label',`第 ${currentSection} 階段第 ${p} 關${r?'，'+r.subject+'，'+r.score+'分':''}`);const em=document.createElement('span');em.className='em';em.textContent=r?({'國文':'📕','數學':'🔢','英文':'🔤','自然':'🌱','社會':'🌏'}[r.subject]||'✅'):['🔁','⭐','📖','🏅','🎁'][p-1];const score=document.createElement('span');score.className='score';score.textContent=r?`${r.score} 分`:`第 ${p} 關`;btn.append(em,score);btn.addEventListener('click',()=>openEditor(id));const caption=document.createElement('span');caption.className='stage-caption';caption.textContent=r?r.subject:'點擊輸入成績';row.append(btn,caption);path.append(row)}}
function renderReport(){let entries=Object.entries(data.records).filter(([id])=>Number(id.split('-')[0])<=data.sectionCount).sort((a,b)=>Number(a[0].split('-')[0])-Number(b[0].split('-')[0])||Number(a[0].split('-')[1])-Number(b[0].split('-')[1]));const total=data.sectionCount*5;$('completionText').textContent=`${entries.length} / ${total}`;$('progressFill').style.width=`${Math.min(100,entries.length/total*100)}%`;$('averageText').textContent=`平均分數：${entries.length?(entries.reduce((sum,[,r])=>sum+r.score,0)/entries.length).toFixed(1)+' 分':'—'}`;const root=$('records');root.replaceChildren();if(!entries.length){const el=document.createElement('div');el.className='empty';el.textContent='還沒有紀錄，先到闖關地圖點選關卡吧！';root.append(el);return}for(const [id,r] of entries){const [s,p]=id.split('-');const item=document.createElement('div');item.className='record';const left=document.createElement('div');const name=document.createElement('strong');const pill=document.createElement('span');pill.className='subject-pill '+(SUBJECT_CLASSES[r.subject]||'');pill.textContent=r.subject;name.append(pill,document.createTextNode(`${r.score} 分`));const sub=document.createElement('div');sub.className='muted';sub.textContent=`第 ${s} 階段 / 第 ${p} 關${r.notes?' · '+r.notes:''}`;left.append(name,sub);const edit=document.createElement('button');edit.className='small-btn';edit.textContent='編輯';edit.addEventListener('click',()=>openEditor(id));item.append(left,edit);root.append(item)}}
function openEditor(id){editingId=id;const [s,p]=id.split('-');const r=data.records[id];$('modalTitle').textContent=`第 ${s} 階段 · 第 ${p} 關`;$('subjectInput').value=r?.subject||'';$('scoreInput').value=r?.score??'';$('notesInput').value=r?.notes||'';$('deleteBtn').style.display=r?'block':'none';$('modalBg').classList.add('open');$('subjectInput').focus()}
function closeEditor(){$('modalBg').classList.remove('open');editingId=null}
$('stageForm').addEventListener('submit',async e=>{e.preventDefault();const subject=$('subjectInput').value.trim(),score=Number($('scoreInput').value);if(!subject||$('scoreInput').value===''||!Number.isFinite(score)||score<0||score>100){toast('請輸入科目及 0～100 的分數');return}const next=structuredClone(data);next.records[editingId]={subject,score,notes:$('notesInput').value.trim(),updatedAt:new Date().toISOString()};try{await save(next);closeEditor();toast('✅ 關卡成績已儲存')}catch(err){toast('❌ '+err.message)}});
$('deleteBtn').addEventListener('click',async()=>{if(!confirm('確定刪除這一關的紀錄？'))return;const next=structuredClone(data);delete next.records[editingId];try{await save(next);closeEditor();toast('紀錄已刪除')}catch(err){toast('❌ '+err.message)}});
$('cancelBtn').addEventListener('click',closeEditor);$('modalBg').addEventListener('click',e=>{if(e.target===$('modalBg'))closeEditor()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeEditor()});
$('sectionSelect').addEventListener('change',e=>{currentSection=Number(e.target.value);render()});$('prevSection').addEventListener('click',()=>{if(currentSection>1){currentSection--;render()}});$('nextSection').addEventListener('click',async()=>{if(currentSection<data.sectionCount){currentSection++;render();return}await addStage()});$('addSection').addEventListener('click',addStage);async function addStage(){if(!Number.isSafeInteger(data.sectionCount+1)){toast('階段數超過瀏覽器可處理範圍');return}const nextCount=data.sectionCount+1;try{await save({...data,sectionCount:nextCount});currentSection=nextCount;render();toast(`✅ 已新增第 ${nextCount} 階段`)}catch(err){toast('❌ '+err.message)}}
function switchView(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('visible',v.id===id));document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('selected',b.dataset.view===id));window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('.bottom button').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));$('jumpBtn').addEventListener('click',()=>switchView('reportView'));
$('downloadBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(data,null,2)+'\n'],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='records.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('已匯出 records.txt')});$('uploadBtn').addEventListener('click',()=>$('uploadFile').click());$('uploadFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const raw=normalize(JSON.parse(await file.text()));if(!confirm('匯入會取代目前全部紀錄，確定繼續？'))return;await save(raw);currentSection=Math.min(currentSection,data.sectionCount);render();toast('✅ 已成功匯入 TXT / JSON')}catch(err){toast('❌ 匯入失敗：'+err.message)}finally{e.target.value=''}});
$('saveSectionCount').addEventListener('click',async()=>{const n=Number($('sectionCount').value);if(!Number.isInteger(n)||n<1||!Number.isSafeInteger(n)){toast('請輸入有效的正整數階段數');return}try{await save({...data,sectionCount:n});toast('✅ 階段數已更新')}catch(err){toast('❌ '+err.message)}});$('clearBtn').addEventListener('click',async()=>{if(!confirm('要刪除所有成績紀錄嗎？此動作無法復原。'))return;try{await save({...data,records:{}});toast('已清空紀錄')}catch(err){toast('❌ '+err.message)}});
load();
})();
</script>
</body>
</html>
